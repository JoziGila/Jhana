.tabs a { text-align: center; text-decoration: none; color: var(--muted); padding: 10px 6px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; }
.tabs a[aria-current="page"] { color: var(--fg); background: var(--raised); }
